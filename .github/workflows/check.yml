name: Validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: taha_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taha-test .
      - run: >-
          docker run --rm --network host
          -e TC_TEST_DATABASE=true -e MYSQLHOST=127.0.0.1 -e MYSQLPORT=3306
          -e MYSQLUSER=root -e MYSQLPASSWORD=test-password -e MYSQLDATABASE=taha_test
          -e OWNER_ID=123456789 -e APP_SECRET=abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
          -e BASE_URL=https://example.test -e DATA_DIR=/tmp/taha-test
          --entrypoint sh taha-test -c 'mkdir -p /tmp/taha-test && php /app/tests/integration.php'
